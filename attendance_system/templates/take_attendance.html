{% extends "base.html" %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-pencil-square"></i> Take Attendance</h2>

<div class="card">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Mark Attendance</h5>
    </div>
    <div class="card-body">
        <form method="POST" id="attendanceForm">
            <div class="row mb-4">
                <div class="col-md-3">
                    <label for="date" class="form-label">Date *</label>
                    <input type="date" class="form-control" id="date" name="date" value="{{ today }}" required>
                </div>
                <div class="col-md-3">
                    <label for="subject" class="form-label">Subject *</label>
                    <select class="form-control" id="subject" name="subject" required>
                        <option value="">Select Subject</option>
                        {% for subject in subjects %}
                        <option value="{{ subject }}">{{ subject }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="marked_by" class="form-label">Marked By *</label>
                    <input type="text" class="form-control" id="marked_by" name="marked_by" placeholder="Teacher/Staff Name" required>
                </div>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>Roll Number</th>
                            <th>Student Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ student[1] }}</td>
                            <td>{{ student[2] }}</td>
                            <td>
                                <div class="btn-group" role="group">
                                    <input type="radio" class="btn-check" name="status_{{ student[0] }}" id="present_{{ student[0] }}" value="Present" autocomplete="off" checked>
                                    <label class="btn btn-outline-success" for="present_{{ student[0] }}">Present</label>
                                    
                                    <input type="radio" class="btn-check" name="status_{{ student[0] }}" id="absent_{{ student[0] }}" value="Absent" autocomplete="off">
                                    <label class="btn btn-outline-danger" for="absent_{{ student[0] }}">Absent</label>
                                    
                                    <input type="radio" class="btn-check" name="status_{{ student[0] }}" id="late_{{ student[0] }}" value="Late" autocomplete="off">
                                    <label class="btn btn-outline-warning" for="late_{{ student[0] }}">Late</label>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="mt-3">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-save"></i> Save Attendance
                </button>
                <button type="button" class="btn btn-secondary btn-lg" onclick="markAll('Present')">
                    <i class="bi bi-check-all"></i> All Present
                </button>
                <button type="button" class="btn btn-secondary btn-lg" onclick="markAll('Absent')">
                    <i class="bi bi-x-circle"></i> All Absent
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function markAll(status) {
    const radioButtons = document.querySelectorAll('input[type="radio"]');
    radioButtons.forEach(radio => {
        if (radio.value === status) {
            radio.checked = true;
        }
    });
}

// Set today's date as default if not set
const dateInput = document.getElementById('date');
if (!dateInput.value) {
    dateInput.value = new Date().toISOString().split('T')[0];
}
</script>
{% endblock %}
